# Карта данных «Государственные финансы». Схема — в data/README.md.
# Вопросы и источники — с интеллект-карты (версия 2), доступность — по ромбам карты для печати.
# Пары «вопрос — источник», которых нет на карте для печати, оставлены без доступности.

id: public-finance
title: Государственные финансы
kind: [questions, availability]
checked: 2019-12
author: Иван Бегтин
license: CC0
info_sources: ФГИС КИ, официальные сайты органов власти, экспертный анализ
images:
  mindmap: /img/atlas/public-finance-mindmap.webp
  print: /img/atlas/public-finance-print.webp
downloads:
  mindmap: /img/atlas/public-finance-mindmap.png
  print: /downloads/public-finance.pdf
notes:
  - Интеллект-карта (версия 2) полнее карты для печати. На карте для печати нет вопроса 21 и источников spending.gov.ru и reestrgk.roskazna.ru; у этих пар доступность не указана.
  - Только на карте для печати есть budget4me.ru (вопрос 12), fas.gov.ru (вопрос 13), minfin.ru (вопрос 14), government.ru и «сайты госпрограмм и сайты ФОИВов» (вопрос 8), сайты региональных финансовых органов (вопросы 5 и 16). В данные они не перенесены.
  - На карте для печати в вопросе 6 четвёртой строкой стоит «фактически потраченные средства бюджета» — похоже на ошибку вёрстки.
  - На карте для печати нет budget.gov.ru в вопросе 10, roskazna.ru в вопросе 14 и gasu.gov.ru в вопросе 7; у этих пар доступность не указана.
  - Источник rosim.ru отмечен доступным в вопросе 18 и недоступным в вопросе 19 — так на исходной карте.

