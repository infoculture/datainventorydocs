notes:
  - Интеллект-карта и карта для печати совпадают по вопросам и источникам.
  - В вопросе 14 исправлена опечатка исходной карты («статистистику»).
  - Источник www.gis-tek.ru отмечен доступным в вопросе 1 и недоступным в вопросе 5 — так на исходной карте.

