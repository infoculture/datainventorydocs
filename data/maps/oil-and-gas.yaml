# Карта данных «Нефть и газ». Схема — в data/README.md.
# Вопросы и источники — с интеллект-карты, доступность — по ромбам карты для печати.

id: oil-and-gas
title: Нефть и газ
kind: [questions, availability]
checked: 2019-12
author: Иван Бегтин
license: CC0
info_sources: официальные сайты профильных ФОИВ, официальные сайты нефтегазовых компаний, экспертный анализ
images:
