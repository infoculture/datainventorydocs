# Карта данных «Здравоохранение». Схема — в data/README.md.
# Вопросы и источники — с интеллект-карты, доступность — по ромбам карты для печати.

id: health
title: Здравоохранение
kind: [questions, availability]
checked: 2018-12
author: Иван Бегтин
license: CC0
info_sources: ФГИС КИ, официальные сайты органов власти, экспертный анализ
images:
  mindmap: /img/atlas/health-mindmap.webp
  print: /img/atlas/health-print.webp
downloads:
  mindmap: /img/atlas/health-mindmap.png
  print: /downloads/health.pdf
notes:
  - На карте для печати есть блок «Затраты на научные исследования в России» (rosrid.ru, budget.gov.ru, bus.gov.ru, rs.budget.gov.ru, zakupki.gov.ru), которого нет на интеллект-карте. Похоже, он перенесён с карты «Государственные финансы»; в данные не включён.
  - В вопросе 7 на обеих исходных картах mdmi.roszdravnadzor.ru указан дважды; в данных — один раз.
  - Легенды у интеллект-карты нет, доступные источники на ней подчёркнуты разными цветами (бирюзовым, тёмно-зелёным, синим); доступность взята с карты для печати.

