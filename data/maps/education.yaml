  - В вопросе 16 на обеих исходных картах vak.ed.gov.ru указан дважды; в данных — один раз.
  - Источник «сайты департаментов образования субъектов федерации» отмечен доступным с ограничениями в вопросе 1 и доступным в вопросе 9 — так на исходной карте.

